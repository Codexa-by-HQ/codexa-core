name: Publish to JSR

on:
  push:
    tags:
      - "v*"
  # Allow manual trigger from GitHub Actions tab as well
  workflow_dispatch:

jobs:
  publish:
    name: Publish @codexa/core
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for OIDC authentication with JSR (no secrets/tokens needed)
      
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"

      - name: Reject implementation source and source maps
        shell: bash
        run: |
          unexpected=$(git ls-files -- '*.ts' '*.tsx' '*.map' ':!:*.d.ts')
          if [ -n "$unexpected" ]; then
            echo "::error::Release repositories must contain only compiled code and declarations."
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Check compiled package types
        run: deno task check

      - name: Validate release package
        run: deno task dry-run

      - name: Publish existing build to JSR
        run: deno task publish
